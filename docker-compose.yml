services:
  postgres:
    image: postgres:16-alpine
    container_name: finguard-postgres
    restart: always
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard_secret
      POSTGRES_DB: finguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/views.sql:/docker-entrypoint-initdb.d/02_views.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finguard-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finguard:finguard_secret@postgres:5432/finguard_db
      SECRET_KEY: finguard-super-secret-key-change-in-production-32chars
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      MODEL_PATH: models/production
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finguard-frontend
    restart: always
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000/api/v1
    ports:
      - "8501:8501"

volumes:
  pgdata:
